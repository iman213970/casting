<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><title>Casting</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://wsrv.nl" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b10;--panel:#14141c;--panel2:#1a1a24;--line:#262632;--fg:#f4f2ef;--mut:#8b8b99;--acc:#ff4b2b;--yel:#f7c61b;--grn:#3ddc84;
--C:#7b7f8c;--U:#37c26e;--R:#3b82f6;--E:#a855f7;--L:#f7c61b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 Inter,system-ui,sans-serif;padding-bottom:100px}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque',Inter,system-ui,sans-serif;font-weight:800;margin:0;letter-spacing:-.01em}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
/* barre du haut */
.top{position:sticky;top:0;z-index:10;background:rgba(11,11,16,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 0 10px}
.top .wrap{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--acc);display:grid;place-items:center;font-size:22px;border:2px solid #ff8a6f}
.sp{flex:1}
.pill{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13px;min-width:96px}
.pill .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.bar{height:3px;background:#000;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.pop{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:10px 14px;font-weight:700;font-size:14px}
.avatar{width:42px;height:42px;border-radius:50%;border:2px solid var(--acc);display:grid;place-items:center;font-weight:800;color:var(--acc);background:var(--panel)}
/* nav du bas */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:15;background:rgba(14,14,20,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.nav .wrap{display:grid;grid-template-columns:1fr 1fr 90px 1fr 1fr;align-items:end;text-align:center}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:4px}
.nav button b{font-size:22px;font-family:'Bricolage Grotesque',Inter,system-ui,sans-serif}
.nav button.on{color:var(--acc)}
.open-btn{position:relative;width:68px;height:68px;margin:-30px auto 0;border-radius:50%;background:var(--acc)!important;border:4px solid var(--bg)!important;display:grid!important;place-items:center;color:#fff!important;font-size:28px;box-shadow:0 0 0 2px #ff4b2b66,0 8px 24px #ff4b2b55}
.open-btn .bd{position:absolute;top:-4px;right:-4px;background:#fff;color:#111;font-size:12px;font-weight:800;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center}
.open-lbl{font-size:11px;color:var(--mut);margin-top:2px}
/* accueil */
.hero{margin:16px 0;border-radius:22px;border:1px solid #4a3d12;background:radial-gradient(120% 90% at 50% 0,#3a2d08 0,#14141c 60%);padding:18px 18px 20px;text-align:left;overflow:hidden}
.eyebrow{font:700 11px 'JetBrains Mono',ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--yel);text-transform:uppercase}
.hero h2{font-size:32px;margin:4px 0}.mut{color:var(--mut)}
.btn{display:block;width:100%;border-radius:99px;padding:16px;font-weight:800;font-size:16px;text-align:center;font-family:'Bricolage Grotesque',Inter,system-ui,sans-serif}
.btn.y{background:var(--yel);color:#1a1300}.btn.a{background:var(--acc);color:#fff}.btn.g{background:var(--panel);border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.tile.hot{border-color:#7a2a1e;background:#1d1210}
.tile b{display:block;font:800 20px 'Bricolage Grotesque',Inter,system-ui,sans-serif}.tile small{color:var(--mut);font-size:11px}.tile .t{font:700 11px 'JetBrains Mono',ui-monospace,Menlo,monospace;color:var(--acc)}
.sec{margin:26px 0 10px}.sec .eyebrow{color:var(--acc)}.sec h2{font-size:26px}
.scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}

/* ===== CARTE (unités cqi : tout suit la largeur de la carte) ===== */
@property --spin{syntax:'<angle>';initial-value:0deg;inherits:false}
.cw{position:relative;width:100%;aspect-ratio:5/7;container-type:inline-size;cursor:pointer;-webkit-user-select:none;user-select:none}
.tcg{position:absolute;inset:0;border-radius:6cqi;overflow:hidden;background:var(--bg);box-shadow:inset 0 0 0 1cqi var(--fr),0 1cqi 3cqi #0009;isolation:isolate;font-family:'Bricolage Grotesque',Inter,system-ui,sans-serif;color:#fff}
.tcg .im{position:absolute;inset:2cqi;border-radius:4.4cqi;overflow:hidden;background:#0003;z-index:1}
.tcg .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block;-webkit-user-drag:none;pointer-events:none}
.tcg .im::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#000b 0,#0000 22%,#0000 58%,#000d 100%);pointer-events:none}
.tcg .nm{position:absolute;left:5cqi;right:16cqi;top:4.6cqi;z-index:3;font-weight:800;font-size:8.6cqi;line-height:1.05;text-shadow:0 .4cqi 1.6cqi #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcg .rp{position:absolute;right:3.8cqi;top:3.8cqi;z-index:3;width:10cqi;height:10cqi;border-radius:50%;background:var(--fr);color:#14101a;font:800 5.8cqi/10cqi 'JetBrains Mono',ui-monospace,monospace;text-align:center;box-shadow:0 0 2cqi #0008}
.tcg .sw{position:absolute;left:5cqi;right:5cqi;bottom:11.6cqi;z-index:3;font-size:5.4cqi;color:#e6e4ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 .3cqi 1.2cqi #000}
.tcg .bt{position:absolute;left:5cqi;right:5cqi;bottom:4.4cqi;z-index:3;display:flex;justify-content:space-between;font:700 6cqi 'JetBrains Mono',ui-monospace,monospace;text-shadow:0 .3cqi 1.2cqi #000}
.tcg .bt .no{opacity:.7}
.cw .q{position:absolute;left:-1.5cqi;top:-1.5cqi;z-index:5;background:var(--yel);color:#1a1300;font:800 7cqi/1 'JetBrains Mono',ui-monospace,monospace;border-radius:99px;padding:1.6cqi 3.2cqi;box-shadow:0 .6cqi 2cqi #0009}
.cw .lk{position:absolute;right:-1cqi;bottom:-1cqi;z-index:5;font-size:9cqi}
.tcg .fx{position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:inherit;mix-blend-mode:screen}
/* raretés : couleurs de Kyara */
.r-C{--bg:rgb(52,49,59);--fr:rgb(90,86,98)}
.r-U{--bg:rgb(31,59,46);--fr:rgb(63,191,127)}
.r-R{--bg:rgb(27,44,74);--fr:rgb(77,155,255)}
.r-E{--bg:rgb(46,28,71);--fr:rgb(176,114,255)}
.r-L{--bg:linear-gradient(160deg,rgb(90,69,16),rgb(34,26,5),rgb(74,57,12));--fr:rgb(245,197,24)}
.r-M{--fr:conic-gradient(from var(--spin),#ff3d81,#ffb13d,#3dff9a,#3dc5ff,#a43dff,#ff3d81)}
.tcg.r-M{background:conic-gradient(from var(--spin),#ff3d81,#ffb13d,#3dff9a,#3dc5ff,#a43dff,#ff3d81);animation:mspin 5s linear infinite;box-shadow:0 0 5cqi #ff3d8166,0 1cqi 3cqi #0009}
.tcg.r-M::before{content:"";position:absolute;inset:1.8cqi;border-radius:4.6cqi;background:rgb(20,16,28);z-index:0}
.tcg.r-M .rp{background:conic-gradient(from var(--spin),#ff3d81,#ffb13d,#3dff9a,#3dc5ff,#a43dff,#ff3d81)}
@keyframes mspin{to{--spin:360deg}}
.r-R .fx{background:linear-gradient(115deg,transparent 38%,rgba(110,170,255,.38) 50%,transparent 62%);background-size:300% 100%;animation:sweep 5s ease-in-out infinite}
.r-E .fx{background:linear-gradient(115deg,transparent 40%,rgba(200,150,255,.22) 50%,transparent 60%);background-size:300% 100%;animation:sweep 6s ease-in-out infinite}
.r-L{box-shadow:0 0 4cqi #f5c51855}
.r-L .fx{background:radial-gradient(circle at 20% 20%,#fff9 0,transparent 3%),radial-gradient(circle at 70% 60%,#fff7 0,transparent 2.5%),radial-gradient(circle at 40% 85%,#fff8 0,transparent 3%),linear-gradient(115deg,transparent 30%,rgba(255,225,120,.45) 48%,transparent 66%);background-size:100% 100%,100% 100%,100% 100%,280% 100%;animation:sweep 4s ease-in-out infinite}
.r-M .fx{background:conic-gradient(from var(--spin) at 50% 50%,#ff3d8144,#3dff9a33,#3dc5ff44,#a43dff44,#ff3d8144);animation:mspin 6s linear infinite;opacity:.8}
.foil .fx{background:linear-gradient(115deg,transparent 35%,rgba(255,120,200,.4) 46%,rgba(90,220,255,.4) 54%,transparent 65%);background-size:300% 100%;animation:sweep 3.6s ease-in-out infinite}
@keyframes sweep{from{background-position:140% 0}to{background-position:-60% 0}}
.tilting .tcg .fx{animation:none!important;background:radial-gradient(circle at var(--mx,50%) var(--my,30%),#fffd,transparent 38%),linear-gradient(115deg,#ff3d8144,#3dc5ff44,#f7c61b44)!important;opacity:.9!important}
/* carte non possédée : silhouette floue */
.unk .im img{filter:blur(3.2cqi) brightness(.3) saturate(0);transform:scale(1.2)}
.unk .im{background:#0008}
.unk .qm{position:absolute;left:0;right:0;top:34%;text-align:center;z-index:3;font:800 38cqi/1 'Bricolage Grotesque',Inter,sans-serif;color:#fff;opacity:.4}
.unk .fx{display:none}
.unk .nm{opacity:.55}
/* dos de carte */
.cb{position:absolute;inset:0;border-radius:6cqi;overflow:hidden;background:radial-gradient(90% 60% at 50% 30%,color-mix(in srgb,var(--t) 38%,#0d0b12),color-mix(in srgb,var(--t) 14%,#0a0810));box-shadow:inset 0 0 0 1cqi #c9a24a,inset 0 0 0 2.6cqi #0008,inset 0 0 0 3.2cqi #c9a24a77,0 1cqi 3cqi #000a}
.cb .co{position:absolute;width:6cqi;height:6cqi;background:#c9a24a;transform:rotate(45deg)}
.cb .co.a{left:7cqi;top:7cqi}.cb .co.b{right:7cqi;top:7cqi}.cb .co.c{left:7cqi;bottom:7cqi}.cb .co.d{right:7cqi;bottom:7cqi}
.cb .seal{position:absolute;left:50%;top:46%;width:96cqi;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:repeating-conic-gradient(#c9a24a30 0 3deg,transparent 3deg 10deg);-webkit-mask:radial-gradient(circle,#0000 28%,#000 29%,#000 62%,#0000 63%);mask:radial-gradient(circle,#0000 28%,#000 29%,#000 62%,#0000 63%)}
.cb .med{position:absolute;left:50%;top:46%;width:40cqi;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#2b2634,#0b0910);border:1.8cqi solid #c9a24a;box-shadow:0 0 4cqi #000a,inset 0 0 3cqi #000;display:grid;place-items:center;font-size:19cqi;line-height:1}
.cb .wm{position:absolute;left:0;right:0;bottom:15cqi;text-align:center;font:800 7.4cqi 'Bricolage Grotesque',Inter,sans-serif;letter-spacing:.42em;text-indent:.42em;color:#d9b45a}
.cb::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(245,217,138,.28) 50%,transparent 60%);background-size:300% 100%;animation:sweep 5s ease-in-out infinite}
/* fiche inclinable */
.dv{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.tw{perspective:900px;width:min(72vw,290px);touch-action:none;position:relative}
.flip{position:relative;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.flip.live{transition:transform .07s linear}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.bk{position:absolute;inset:0;transform:rotateY(180deg)}
.bkd{position:absolute;inset:0;border-radius:6cqi;background:var(--bg);box-shadow:inset 0 0 0 1cqi var(--fr);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqi;padding:8cqi;text-align:center;overflow:hidden}
.tcg.r-M.bkd,.bkd.r-M{background:rgb(20,16,28);box-shadow:inset 0 0 0 1.4cqi #b04bd6}
.bkd .bt1{font:700 5cqi 'JetBrains Mono',monospace;letter-spacing:.3em;opacity:.8}
.bkd .br{font:800 11cqi 'Bricolage Grotesque',Inter,sans-serif}
.bkd .bn{font:700 5.6cqi 'JetBrains Mono',monospace;color:#fff9}
.bkd .bl{font:700 6.4cqi 'Bricolage Grotesque',Inter,sans-serif}.bkd .bl2{font-size:5.4cqi;color:#ffffffaa}
.bkd .bx{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4cqi;width:100%;margin-top:3cqi}.bkd .bx div{background:#0007;border-radius:3cqi;padding:2.6cqi 1cqi}.bkd .bx b{display:block;font:800 8cqi 'Bricolage Grotesque',Inter,sans-serif}.bkd .bx small{font-size:4.2cqi;color:#fffa}
.hint{color:var(--mut);font-size:12px;text-align:center;margin:0;max-width:300px}
.acts{width:min(72vw,290px);display:grid;gap:8px}
/* ===== PAQUETS (cinéma) ===== */
.pkw{position:relative;width:100%;aspect-ratio:5/7;container-type:inline-size;font-family:'Bricolage Grotesque',Inter,system-ui,sans-serif;color:#fff}
.pkw>div,.pkw>i{position:absolute}
.pochette .foil2{inset:0;border-radius:4cqi;background:linear-gradient(165deg,var(--c1),var(--c2));box-shadow:inset 0 0 0 .8cqi #ffffff44,inset 0 -14cqi 20cqi #0006,0 3cqi 8cqi #000a;overflow:hidden}
.pochette .foil2::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(118deg,#ffffff16 0 .8cqi,transparent .8cqi 3.6cqi),radial-gradient(90% 55% at 30% 8%,#ffffff66,transparent 62%)}
.pochette .foil2::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,#ffffff55 50%,transparent 65%);background-size:300% 100%;animation:sweep 3.6s ease-in-out infinite;mix-blend-mode:screen}
.pochette .cr{left:0;right:0;height:9cqi;background:repeating-linear-gradient(90deg,#00000055 0 .9cqi,transparent .9cqi 2.6cqi),linear-gradient(180deg,#ffffff55,#00000044);border-radius:4cqi 4cqi 0 0}
.pochette .cr.t{top:0}.pochette .cr.b{bottom:0;transform:scaleY(-1)}
.pochette .pf{top:11cqi;bottom:11cqi;width:5cqi;background:repeating-linear-gradient(180deg,#0009 0 3cqi,transparent 3cqi 6cqi);opacity:.55;border-radius:1cqi}
.pochette .pf.l{left:3cqi}.pochette .pf.r{right:3cqi}
.pochette .pt{top:13cqi;left:0;right:0;text-align:center;font:700 5.6cqi 'JetBrains Mono',monospace;letter-spacing:.4em;text-indent:.4em;text-shadow:0 .4cqi 1cqi #0008}
.pochette .md{left:50%;top:46%;width:42cqi;height:42cqi;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a2a33,#0b0b10);border:2.2cqi solid #f3d98a;box-shadow:0 0 8cqi #0009,inset 0 0 6cqi #000a;display:grid;place-items:center;font-size:20cqi;line-height:1}
.pochette .pn{left:6cqi;right:6cqi;bottom:21cqi;text-align:center;font-weight:800;font-size:11cqi;text-shadow:0 .6cqi 2cqi #000a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pochette .pc{left:50%;bottom:12.5cqi;transform:translateX(-50%);background:#0009;border:.5cqi solid #ffffff55;border-radius:99em;padding:1cqi 5cqi;font:700 5.4cqi 'JetBrains Mono',monospace;white-space:nowrap}
.env .paper{inset:0;border-radius:3cqi;background:linear-gradient(170deg,#f3e6c8,#d8c597);box-shadow:inset 0 0 0 .8cqi #00000022,0 3cqi 8cqi #000a}
.env .paper::before{content:"";position:absolute;inset:0;border-radius:3cqi;background:linear-gradient(to top right,transparent 49.6%,#0002 50%,transparent 50.6%) 0 100%/50% 46% no-repeat,linear-gradient(to top left,transparent 49.6%,#0002 50%,transparent 50.6%) 100% 100%/50% 46% no-repeat}
.env .flap{left:0;right:0;top:0;height:54%;background:linear-gradient(180deg,#e9d9b3,#d2bd8a);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .5s cubic-bezier(.3,1.2,.4,1);filter:drop-shadow(0 2cqi 2cqi #0005);z-index:3}
.go .env .flap{transform:perspective(120cqi) rotateX(180deg)}
.env .wax{left:50%;top:44%;width:25cqi;height:25cqi;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#e0453c,#8e1a16);box-shadow:0 1.4cqi 3cqi #0008,inset 0 0 0 1.4cqi #ffffff22;display:grid;place-items:center;text-align:center;z-index:4;line-height:1;color:#ffe9b0}
.env .wax b{display:block;font:800 11cqi 'Bricolage Grotesque',sans-serif}.env .wax small{display:block;font:700 4.2cqi 'JetBrains Mono',monospace;letter-spacing:.1em}
.go .env .wax{opacity:0;transition:opacity .2s}
.env .pt{left:0;right:0;top:61%;text-align:center;font:700 5.2cqi 'JetBrains Mono',monospace;letter-spacing:.32em;text-indent:.32em;color:#5b4a22}
.env .pn{left:5cqi;right:5cqi;top:68%;text-align:center;font-weight:800;font-size:11cqi;color:var(--c1);filter:brightness(.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.env .pc{left:0;right:0;bottom:8cqi;text-align:center;font:700 5cqi 'JetBrains Mono',monospace;color:#5b4a22}
.pkrow{width:46px;height:64px;flex:0 0 auto}
/* ===== ECRAN D'OUVERTURE ===== */
.stage{position:fixed;inset:0;z-index:40;background:radial-gradient(90% 70% at 50% 35%,color-mix(in srgb,var(--pc1,#f7c61b) 26%,#0b0b10),#0b0b10 72%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;overflow:hidden}
.packwrap{user-select:none;-webkit-user-select:none;position:relative;width:var(--w,220px);height:calc(var(--w,220px)*1.4);touch-action:none;cursor:grab;animation:fl 2.4s ease-in-out infinite}
.packwrap.go{animation:none}
@keyframes fl{50%{transform:translateY(-8px) rotate(1.2deg)}}
.packwrap .lay{position:absolute;inset:0}
.packwrap .strip{transform-origin:100% 14%;transition:transform .12s linear}
.packwrap.go .strip{animation:fly .55s cubic-bezier(.4,0,.8,.4) forwards}
@keyframes fly{to{transform:translate(180px,-340px) rotate(48deg);opacity:0}}
.packwrap.go .body{animation:bodyout .6s .35s ease-in forwards}
@keyframes bodyout{to{transform:translateY(40px) scale(.9);opacity:0}}
.packwrap.go.envp .body{animation:bodyout .6s .5s ease-in forwards}
.tear{position:absolute;left:0;top:14%;height:3px;width:0;background:linear-gradient(90deg,#fff,var(--pc1,#f7c61b));box-shadow:0 0 12px 3px var(--pc1,#f7c61b),0 0 30px 8px #fff8;opacity:0;border-radius:3px;z-index:3}
.beam{position:absolute;left:-10%;right:-10%;top:14%;height:0;transform-origin:50% 100%;background:linear-gradient(0deg,#fffc,var(--pc1,#f7c61b) 20%,transparent);clip-path:polygon(8% 100%,92% 100%,160% 0,-60% 0);opacity:0;z-index:2;filter:blur(3px)}
.packwrap.go .beam{animation:beam .9s ease-out forwards}
@keyframes beam{0%{height:0;opacity:0}25%{height:320%;opacity:1}100%{height:320%;opacity:0}}
.spark{position:absolute;left:50%;top:14%;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 10px 2px var(--pc1,#f7c61b);opacity:0;z-index:4}
.packwrap.go .spark{animation:spark .9s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
.qrow{display:flex;gap:8px}.qrow button{min-width:64px;padding:10px 14px;border-radius:99px;background:#ffffff12;border:1px solid #ffffff22;font:800 15px 'Bricolage Grotesque',Inter,sans-serif}.qrow button.on{background:var(--yel);color:#1a1300;border-color:var(--yel)}.qrow button:disabled{opacity:.3}
.lnk{color:var(--mut);text-decoration:underline;font-size:14px;padding:6px}
/* pile face cachée */
.deck{position:relative;width:min(62vw,250px);aspect-ratio:5/7;margin:6px 0}
.deck.glow::before{content:"";position:absolute;inset:-9%;border-radius:12%;background:radial-gradient(circle,var(--glow) 0,transparent 66%);opacity:.75;animation:pulse 1.8s ease-in-out infinite;pointer-events:none}
@keyframes pulse{50%{opacity:.3;transform:scale(1.06)}}

  d.innerHTML=`<div class="recap"><div class="eyebrow">${bs.some(b=>b.god)?'God pack !':bs.some(b=>b.pity)?'Mythique garantie !':bs.some(b=>b.golden)?'✦ Booster doré':'Ton tirage'}</div><div class="best"><div class="mut mono" style="font-size:11px;letter-spacing:.1em">MEILLEURE CARTE</div>${card(best)}</div>
  <div class="sum">${nw?`<span class="new">${nw} nouvelle${nw>1?'s':''}</span>`:''}${r.gain?`<span class="new" style="background:var(--yel);color:#1a1300">+${r.gain} 🍿 de bonus</span>`:''}<span class="dup">${all.length} cartes</span>${all.length-nw?`<span class="dup">${all.length-nw} doublon${all.length-nw>1?'s':''} · +${all.filter(c=>!c.new).reduce((a,c)=>a+REC[c.r],0)} 🍿 si recyclés</span>`:''}</div>
  ${all.length>1?`<div class="mini">${uniq.map(c=>card(c,{q:cnt[c.n]})).join('')}</div>`:''}
  <div style="width:100%;display:grid;gap:8px"><button class="btn y" id="ag">Ouvrir un autre booster</button><button class="btn g" id="vc">Voir la collection</button><button class="btn g" id="cl">Continuer</button></div></div>`;
  $('#ag').onclick=()=>{d.remove();render();openSheet(freeTot()>0?'free':'paid')};$('#cl').onclick=()=>{d.remove();render()};$('#vc').onclick=()=>{d.remove();view='coll';render()};
  $$('.recap .cw').forEach(e=>e.onclick=()=>detail(+e.dataset.n))};
 nextB()}
/* ---------- collection ---------- */
function coll(){
 const shows=[...new Set(CARDS.map(c=>c.show))].sort((a,b)=>a.localeCompare(b));
 $('#v').innerHTML=`<div class="srch"><input id="q" placeholder="Rechercher un perso ou une série…" value="${esc(F.q)}"><button class="ib" id="rcb">♻${recVal()?`<span class="bg">+${recVal()}</span>`:''}</button></div>
 <div class="chips">${['C','U','R','E','L','M'].reverse().map(r=>`<span class="chip ${F.r==r?'on':''}" data-r="${r}" ${F.r==r?`style="color:${RC[r]};border-color:${RC[r]}"`:''}>${RN[r]}</span>`).join('')}</div>
 <div class="chips">${[['all','Toutes'],['own','Possédées'],['miss','Manquantes'],['dup','Doublons']].map(([k,l])=>`<span class="chip ${F.own==k?'on':''}" data-o="${k}">${l}</span>`).join('')}</div>
 <select class="sel" id="fs2"><option value="">Toutes les séries</option>${shows.map(s=>`<option ${F.show==s?'selected':''}>${esc(s)}</option>`).join('')}</select>
 <select class="sel" id="fg"><option value="">Tous les genres</option>${ST.themes.map(g=>`<option value="${g}" ${F.g==g?'selected':''}>${fr(g)}</option>`).join('')}</select>
 <div class="mut" id="cnt" style="margin:6px 0 12px"></div><div class="grid" id="gr"></div>`;
 $('#q').oninput=e=>{F.q=e.target.value;list()};$('#fs2').onchange=e=>{F.show=e.target.value;list()};$('#fg').onchange=e=>{F.g=e.target.value;list()};
 $$('.chip[data-r]').forEach(c=>c.onclick=()=>{F.r=F.r==c.dataset.r?'':c.dataset.r;coll()});$$('.chip[data-o]').forEach(c=>c.onclick=()=>{F.own=c.dataset.o;coll()});
 $('#rcb').onclick=recycleAll;list()}
function list(){
 const q=F.q.toLowerCase(),o=c=>ST.inv[c.n]||0;
 let L=CARDS.filter(c=>(!F.r||c.r==F.r)&&(!F.show||c.show==F.show)&&(!F.g||c.g.includes(F.g))&&(!q||(c.name+' '+c.show).toLowerCase().includes(q)));
 if(F.own=='own')L=L.filter(c=>o(c));if(F.own=='miss')L=L.filter(c=>!o(c));if(F.own=='dup')L=L.filter(c=>o(c)>1);
 $('#cnt').textContent=L.length.toLocaleString('fr')+' cartes';
 $('#gr').innerHTML=L.slice(0,150).map(c=>`<div class="gc">${card(c,{q:o(c),unk:!o(c)})}${o(c)>1?`<div class="val">+${(o(c)-1)*REC[c.r]} 🍿 recyclables</div>`:''}</div>`).join('')+(L.length>150?`<p class="mut" style="grid-column:1/-1;text-align:center">Affine la recherche pour voir les ${L.length-150} autres.</p>`:'');
 bindCards()}
function bindCards(){$$('.cw[data-n]').forEach(e=>{if(e.closest('.fan')||e.closest('.stage'))return;e.onclick=()=>detail(+e.dataset.n)})}
/* ---------- fiche d'une carte : inclinable + dos ---------- */
function cardOdds(c){const nr=CARDS.filter(x=>x.r==c.r).length;let pr=1-Math.pow(1-ST.odds[c.r]/10000,5);if(c.r=='M')pr=Math.max(pr,1/ST.pity_max);const b=pr/nr;return b>0?Math.round(1/b):0}
function backFace(c,q){return `<div class="cw"><div class="bkd r-${c.r}"><div class="bt1">CASTING</div><div class="br" style="color:${RC[c.r]}">${RN[c.r]}</div><div class="bn">#${pad(c.n)} / ${CARDS.length}</div>
 ${q?`<div class="bl">${esc(c.show)}</div><div class="bl2">${esc(c.act||'')}</div>`:`<div class="bl">Série ${esc(c.show)}</div><div class="bl2">Perso à découvrir</div>`}
 <div class="bx"><div><b>${q}</b><small>chez toi</small></div><div><b id="own">–</b><small>joueurs l'ont</small></div><div><b>${REC[c.r]}</b><small>🍿 recyclée</small></div></div></div></div>`}
function detail(n){
 const c=CARDS[n-1],q=ST.inv[n]||0,d=document.createElement('div');d.className='shade';d.style.alignItems='center';d.style.zIndex=50;d.style.background='#000e';d.onclick=e=>{if(e.target==d)d.remove()};
 const od=cardOdds(c);if(!window._vw){window._vw=1;rpc('quest_event',{e:'view'}).catch(()=>{})}
 d.innerHTML=`<div class="dv"><div class="tw" id="tw"><div class="flip" id="fl"><div class="face">${card(c,{unk:!q})}</div><div class="face bk">${backFace(c,q)}</div></div></div>
 <p class="hint">${q?`${esc(c.act)}${c.act?' · ':''}${c.g.slice(0,3).map(fr).join(', ')}`:`Tu ne l'as pas encore · environ 1 chance sur ${od.toLocaleString('fr')} par booster Mix`}<br>Bouge le doigt pour l'incliner · touche la carte pour la retourner</p>
 <div class="acts">${q>1?`<button class="btn y" id="rc1">Recycler ${q-1} doublon${q>2?'s':''} · +${(q-1)*REC[c.r]} 🍿</button>`:''}<button class="btn g" id="cl2">Fermer</button></div></div>`;
 document.body.append(d);$('#cl2').onclick=()=>d.remove();
 const tw=$('#tw'),fl=$('#fl'),cd=tw.querySelector('.cw');let flip=0,sx=0,sy=0,mv=0,rx=0,ry=0;
 const apply=()=>{fl.style.setProperty('--rx',rx+'deg');fl.style.setProperty('--ry',(ry+flip)+'deg')};
 const aim=e=>{if(MO())return;const r=tw.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;rx=-y*24;ry=x*28;cd.style.setProperty('--mx',(x+.5)*100+'%');cd.style.setProperty('--my',(y+.5)*100+'%');apply()};
 tw.onpointerdown=e=>{sx=e.clientX;sy=e.clientY;mv=0;fl.classList.add('live');cd.classList.add('tilting');aim(e)};
 tw.onpointermove=e=>{if(e.pointerType=='mouse'||e.buttons||mv>=0){mv=Math.max(mv,Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy));fl.classList.add('live');cd.classList.add('tilting');aim(e)}};
 const end=()=>{fl.classList.remove('live');cd.classList.remove('tilting');rx=0;ry=0;apply()};
 tw.onpointerup=()=>{if(mv<8)flip=flip?0:180;end()};tw.onpointerleave=end;tw.onpointercancel=end;
 rpc('card_owners',{card:n}).then(v=>{const e=$('#own');if(e)e.textContent=v}).catch(()=>{});
 if($('#rc1'))$('#rc1').onclick=async()=>{try{const x=await rpc('recycle',{n_card:n,k:q-1});ST=x.state;d.remove();toast('+'+x.gain+' 🍿');render()}catch(e){toast(e.message)}}}
/* ---------- missions ---------- */
async function miss(){
 $('#v').innerHTML='<div class="center">Chargement des missions…</div>';
 let Q;try{Q=await rpc('my_quests')}catch(e){$('#v').innerHTML=`<div class="center">${esc(e.message)}</div>`;return}
 if(view!='miss')return;
 const by=k=>Q.quests.filter(q=>q.kind==k),s=Q.streak,hm=x=>{x=Math.max(0,x|0);const d=x/86400|0,h=(x%86400)/3600|0,m=(x%3600)/60|0;return (d?d+' j ':'')+h+' h '+String(m).padStart(2,'0')};
 const row=q=>`<div class="qs ${q.claimed?'done':''}"><div class="qt"><b>${esc(q.label)}</b>${q.desc?`<small>${esc(q.desc)}</small>`:''}<div class="qb"><i style="width:${q.progress/q.target*100}%"></i></div><small class="mono">${q.progress.toLocaleString('fr')} / ${q.target.toLocaleString('fr')}</small></div>
  ${q.claimed?'<span class="ok mono">✓ Récupéré</span>':q.done?`<button class="btn y" data-cq="${q.id}">+${q.pop} 🍿</button>`:`<span class="mono mut" style="white-space:nowrap">+${q.pop} 🍿</span>`}</div>`;
 const bon=(k,l)=>{const b=Q.bonus[k],n=Q.bonus_rewards[k];return `<div class="qs bonus ${b.claimed?'done':''}"><div class="qt"><b>${l}</b><small>+${n} booster${n>1?'s':''} gratuit${n>1?'s':''} bonus</small></div>${b.claimed?'<span class="ok mono">✓ Récupéré</span>':b.all?`<button class="btn y" data-cq="bonus_${k}">Récupérer</button>`:'<span class="mono mut">🔒</span>'}</div>`};
 const gotTo=s.claimed_today?s.day:(s.next||1)-1;
 const ach=by('ach').sort((a,b)=>(b.done&&!b.claimed)-(a.done&&!a.claimed)||a.claimed-b.claimed);
 $('#v').innerHTML=`<div class="sec"><div class="eyebrow">Chaque jour</div><h2>Série de connexion</h2></div>
 <div class="strk">${s.rewards.map((r,i)=>{const d=i+1;return `<div class="${d<=gotTo?'got':''} ${!s.claimed_today&&d==s.next?'cur':''} ${d==7?'d7':''}">J${d}<b>${r}</b>🍿${d==7?'<br>+ doré':''}</div>`}).join('')}</div>
 <button class="btn ${s.claimed_today?'g':'y'}" data-cq="streak" ${s.claimed_today?'disabled':''}>${s.claimed_today?'Reviens demain pour le jour '+(s.day>=7?1:s.day+1):'Récupérer le jour '+s.next+' · +'+s.rewards[s.next-1]+' 🍿'}</button>
 <p class="mut" style="font-size:12px;margin:6px 0 0">Un jour de grâce : si tu rates un jour, la série tient encore.</p>
 ${!Q.bonus.welcome.claimed?`<div class="sec"><div class="eyebrow">Pour bien commencer</div><h2>Bienvenue</h2></div>${by('welcome').map(row).join('')}${bon('welcome','Toutes les missions de bienvenue')}`:''}
 <div class="sec"><div class="eyebrow">Nouvelles dans ${hm(Q.next_daily)}</div><h2>Du jour</h2></div>${by('daily').map(row).join('')}${bon('daily','Les 3 missions du jour')}
 <div class="sec"><div class="eyebrow">Nouvelles dans ${hm(Q.next_weekly)}</div><h2>De la semaine</h2></div>${by('weekly').map(row).join('')}${bon('weekly','Les 3 missions de la semaine')}
 <div class="sec"><div class="eyebrow">${ach.filter(a=>a.claimed).length} / ${ach.length} débloqués</div><h2>Succès</h2></div>${ach.map(row).join('')}`;
 $$('[data-cq]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const x=await rpc('claim_quest',{qid:b.dataset.cq});ST=x.state;
  toast(x.boosters?`+${x.boosters} booster${x.boosters>1?'s':''} bonus`:`+${x.popcorns} 🍿${x.golden?' · prochain booster doré !':''}`);const y=scrollY;render();scrollTo(0,y)}catch(e){toast(e.message);b.disabled=false}})}
/* ---------- autres onglets ---------- */
function mkt(){$('#v').innerHTML=`<div class="center"><div style="font-size:54px">🏷️</div><h2>Marché</h2><p>Vente et échange de cartes entre joueurs : bientôt.</p></div>`}
function more(){
 $('#v').innerHTML=`<div class="sec"><div class="eyebrow">Compte</div><h2>${esc(ST.name)}</h2></div>
 <div class="tiles"><div class="tile"><b>${ST.boosters}</b><small>boosters ouverts</small></div><div class="tile"><b>${Math.max(0,ST.pity_max-ST.pity)}</b><small>avant Mythique sûre</small></div><div class="tile"><b>${ST.popcorns}</b><small>Popcorns</small></div></div>
 <div class="sec"><div class="eyebrow">Réglages</div></div><button class="btn g" id="mo">Animations : ${MO()?'désactivées':'activées'}</button>
 <div class="sec"><div class="eyebrow">Règles</div><h2>Comment ça marche</h2></div>
 <p class="mut">Un booster gratuit se recharge toutes les ${CFG.free_minutes} minutes (jusqu'à ${ST.free_max} en stock). Le pack du jour est offert chaque jour avec une Épique garantie. Chaque booster contient 5 cartes : 3 Communes ou mieux, 1 Peu commune ou mieux et 1 Rare ou mieux (C C C U R). Après ${ST.golden_every||10} boosters, le suivant est doré (C C U R E). Très rarement, un god pack donne 4 Épiques et 1 Mythique. Une Mythique est garantie après ${ST.pity_max} boosters sans Mythique. À chaque Légendaire ou Mythique obtenue, même en double, tu gagnes ${BON.L} ou ${BON.M} 🍿. Les doublons se recyclent en Popcorns : ${Object.entries(REC).map(([r,v])=>RN[r]+' '+v).join(', ')}.</p><br>
 <button class="btn g" id="lo">Se déconnecter</button><footer>Projet fan non officiel. This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>`;
 $('#mo').onclick=()=>{lsset('mo',MO()?'0':'1');document.documentElement.classList.toggle('mo',MO());more()};
 $('#lo').onclick=async()=>{await sb.auth.signOut();ST=null;render()}}
init();
</script></body></html>
